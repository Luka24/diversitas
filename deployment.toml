# Deployment settings — committed on purpose. Nothing secret goes in here.
#
# price_source: which venue the live dashboard reads prices from.
#   "binance" | "coinbase" | "yahoo"
#
# Set to coinbase on 2026-08-11. The dashboard is hosted on Streamlit Cloud, and
# Binance geo-blocks datacenter IPs — the hosted app gets a permanent
#
#     HTTP 451 "Service unavailable from a restricted location"
#
# where the same request from a laptop returns 200. That is not an outage and it
# is not going to clear, so the page was raising a fallback alarm on every single
# render and telling the reader to wait for something that will never arrive.
# Pinning turns it into a decision that is written down.
#
# What it costs. Remeasured 2026-08-21 on BTC over the whole window both venues
# cover, 2018-06-05 to 2026-08-21, at 0.30 % per side with the 5 % floor:
#
#   Lean rules            Sortino    CAGR      MaxDD     trades
#     binance               1.928    38.9 %    -31.8 %     19
#     coinbase              1.882    39.5 %    -30.7 %     18
#
#   Momentum rules
#     binance               1.811    39.4 %    -50.9 %     42
#     coinbase              1.837    40.4 %    -50.9 %     44
#
# Neither venue is reliably better. Coinbase gives up 0.05 Sortino on Lean and
# gains 0.03 on Momentum, with a trade or two moving by a day. That is the same
# strategy on slightly different prices, which is the point: the choice is made
# on reachability, not on which backtest looks nicer.
#
# Yahoo is NOT an equivalent substitute, 8 points of annual return and fifteen
# of drawdown, which is why it is not in the crypto chain at all.
#
# The figures this replaces were wrong twice over: recorded from a run whose fee
# constant was 0.003 % per side instead of 0.30 %, and with a Sortino that
# divided by the standard deviation of the negative days only. That second bug
# is why they read 0.917 and 0.876 where the correct formula reads about 1.9.
#
# Reports and the frozen reference are unaffected: they run off the Binance
# snapshot in testing/data/sources/, which needs no network.
#
# Precedence, highest first:
#   1. DIVERSITAS_PRICE_SOURCE in the environment
#   2. price_source in Streamlit secrets
#   3. this file
# So a laptop can go back to Binance for one session with
#   DIVERSITAS_PRICE_SOURCE=binance streamlit run lean/diversitas/dashboard.py
price_source = "coinbase"
